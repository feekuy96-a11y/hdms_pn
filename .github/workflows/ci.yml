name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load public configuration
        run: node -e 'const fs=require("fs"),c=require("./.github/hdms-public.json");fs.appendFileSync(process.env.GITHUB_ENV,`NEXT_PUBLIC_SUPABASE_URL=${c.supabaseUrl}\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${c.supabasePublishableKey}\n`);'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:pages
        env:
          BASE_PATH: /hdms_pn
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_STATIC: "1"
          BASE_PATH: /hdms_pn
      - name: Build and test public offline opt-in and rollback
        env:
          BASE_PATH: /hdms_pn
          PLAYWRIGHT_STATIC: "1"
          HDMS_TEST_PUBLIC_OFFLINE: "1"
        run: |
          DISABLED_OUTPUT="${RUNNER_TEMP}/hdms-offline-disabled"
          mv out "$DISABLED_OUTPUT"
          NEXT_PUBLIC_HDMS_PUBLIC_OFFLINE=1 npm run build:pages
          HDMS_TEST_OFFLINE_DISABLED_OUTPUT="$DISABLED_OUTPUT" npm run test:e2e -- tests/e2e/public-offline.spec.ts tests/e2e/public-offline-upgrade.spec.ts
