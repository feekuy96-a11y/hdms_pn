name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify changes and verify lightweight docs
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          tier=full
          classifier="$RUNNER_TEMP/classify-ci-scope.mjs"
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git show "$BASE_SHA:scripts/classify-ci-scope.mjs" > "$classifier"; then
            candidate=$(node "$classifier" --classify "$BASE_SHA" "$GITHUB_SHA") || candidate=full
            case "$candidate" in
              docs|copy) tier="$candidate" ;;
            esac
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "CI tier: $tier"
          if [[ "$tier" == docs || "$tier" == copy ]]; then
            node "$classifier" --validate-docs "$BASE_SHA" "$GITHUB_SHA"
          fi

  copy:
    name: Display copy smoke
    needs: scope
    if: needs.scope.outputs.tier == 'copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load public configuration
        run: node -e 'const fs=require("fs"),c=require("./.github/hdms-public.json");fs.appendFileSync(process.env.GITHUB_ENV,`NEXT_PUBLIC_SUPABASE_URL=${c.supabaseUrl}\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${c.supabasePublishableKey}\n`);'
      - run: npm run check:deploy
        env:
          BASE_PATH: /hdms_pn
          NEXT_PUBLIC_HDMS_PUBLIC_OFFLINE: "1"
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test copy on desktop and mobile
        run: npm run test:e2e -- tests/e2e/public-display-copy.spec.ts
        env:
          PLAYWRIGHT_STATIC: "1"
          BASE_PATH: /hdms_pn

  browser:
    needs: scope
    if: needs.scope.outputs.tier == 'full'
    name: Browser tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load public configuration
        run: node -e 'const fs=require("fs"),c=require("./.github/hdms-public.json");fs.appendFileSync(process.env.GITHUB_ENV,`NEXT_PUBLIC_SUPABASE_URL=${c.supabaseUrl}\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${c.supabasePublishableKey}\n`);'
      - name: Test CI scope classification
        if: matrix.shard == 1
        run: node --test scripts/classify-ci-scope.test.mjs
      - run: npm run lint
        if: matrix.shard == 1
      - run: npm run typecheck
        if: matrix.shard == 1
      - run: npm run build:pages
        env:
          BASE_PATH: /hdms_pn
      - run: npx playwright install --with-deps chromium
      - name: Run browser test shard
        run: npm run test:e2e -- --shard="$PLAYWRIGHT_SHARD"
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/2
          PLAYWRIGHT_STATIC: "1"
          BASE_PATH: /hdms_pn
      - name: Build and test public offline opt-in and rollback
        if: matrix.shard == 1
        env:
          BASE_PATH: /hdms_pn
          PLAYWRIGHT_STATIC: "1"
          HDMS_TEST_PUBLIC_OFFLINE: "1"
        run: |
          DISABLED_OUTPUT="${RUNNER_TEMP}/hdms-offline-disabled"
          mv out "$DISABLED_OUTPUT"
          NEXT_PUBLIC_HDMS_PUBLIC_OFFLINE=1 npm run build:pages
          HDMS_TEST_OFFLINE_DISABLED_OUTPUT="$DISABLED_OUTPUT" npm run test:e2e -- tests/e2e/public-offline.spec.ts tests/e2e/public-offline-upgrade.spec.ts

  # Always publish the existing required check; a skipped or unexplained tier cannot pass.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [scope, copy, browser]
    if: always()
    steps:
      - name: Require the exact jobs for the classified tier
        env:
          TIER: ${{ needs.scope.outputs.tier }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          COPY_RESULT: ${{ needs.copy.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$TIER:$COPY_RESULT:$BROWSER_RESULT" in
            docs:skipped:skipped|copy:success:skipped|full:skipped:success) ;;
            *) exit 1 ;;
          esac
