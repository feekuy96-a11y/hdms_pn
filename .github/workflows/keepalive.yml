name: Supabase keep-alive

# Supabase Free จะ Pause โปรเจกต์ที่ไม่มีการใช้งาน 7 วัน → ยิงคำขออ่านเบาๆ ทุก 3 วัน
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://ebyobrtvisylwawxiurx.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVieW9icnR2aXN5bHdhd3hpdXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzA0OTgsImV4cCI6MjEwODc0NjQ5OH0.aDMnfQk3GG6TFWp5xpKyZekQ2nxT8mLfGtUawpLVrAo
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/system_settings?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
