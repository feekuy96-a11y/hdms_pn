version: '3.8'

services:
  osrm-backend:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: doh_pattani_osrm
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    command: osrm-routed --algorithm mld /data/thailand-latest.osrm --max-matching-size 500 --max-table-size 500
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/101.18,6.86;101.25,6.87"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TZ=Asia/Bangkok

