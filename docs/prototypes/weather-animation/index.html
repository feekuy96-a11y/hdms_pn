<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDMS · ทดลองชั้นข้อมูลอากาศ</title><style>
*{box-sizing:border-box} body{margin:0;background:#0a1622;color:#edf5fa;font:16px system-ui,sans-serif} main{max-width:880px;margin:auto;padding:clamp(12px,3vw,28px)} h1{font-size:clamp(1.35rem,4vw,2rem);margin:8px 0}.tag{font-size:.85rem;color:#2ce5dd;letter-spacing:.09em} .notice{border-left:4px solid #f5ba5e;padding:8px 12px;background:#2e291d;color:#ffe2a5;margin:0 0 12px} .bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} button,a,input{font:inherit} button{padding:8px 12px;min-height:44px;border:1px solid #4b6478;border-radius:7px;color:inherit;background:#192d3c;cursor:pointer} button[aria-pressed=true]{background:#165360;border-color:#57dce3} :focus-visible{outline:3px solid #ffe091;outline-offset:3px} svg{width:100%;height:auto;display:block;background:#1c4257;border-radius:9px} .control{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.control input{flex:1;min-width:130px}.group{margin:10px 0 2px}.note{color:#b3c9d7;font-size:.875rem;margin:8px 0}.key{background:#1b2d3a;padding:6px 10px;border-radius:4px;display:inline-block}.future{color:#fdd385}.rain{color:#78eed6}a{color:#93e8fa;display:inline-block;padding:8px 0}
</style></head><body><main><div class="tag">HDMS · MAP ANIMATION DEMO</div><h1>เรดาร์ฝนและเส้นทางพายุ</h1><p class="notice"><strong>ข้อมูลจำลองเท่านั้น</strong> ไม่ใช่เรดาร์จริง ไม่ใช่ประกาศเตือนภัย และไม่ใช้ตัดสินใจเดินทาง</p><div class="bar" role="group" aria-label="ชั้นข้อมูล"><button id="radar" aria-pressed="true">เรดาร์ฝนย้อนหลัง</button><button id="storm" aria-pressed="false">เส้นทางพายุตัวอย่าง</button></div><svg viewBox="0 0 640 420" role="img" aria-labelledby="map-title map-desc"><title id="map-title">แผนที่โครงร่างจำลองรอบปัตตานี</title><desc id="map-desc">แสดงการเคลื่อนที่ของกลุ่มฝนหรือทางเดินพายุจากข้อมูลสังเคราะห์ ไม่มีขอบเขตทางการ</desc><defs><radialGradient id="precip"><stop stop-color="#f4c74f" stop-opacity=".88"/><stop offset=".48" stop-color="#21cba3" stop-opacity=".78"/><stop offset=".76" stop-color="#318ff0" stop-opacity=".47"/><stop offset="1" stop-color="#318ff0" stop-opacity="0"/></radialGradient><pattern id="grid" width="64" height="60" patternUnits="userSpaceOnUse"><path d="M64 0H0v60" fill="none" stroke="#ffffff" stroke-opacity=".17"/></pattern></defs><path fill="#375448" d="M0 0h110l45 57 79 40 46 8 70 77 46 17 24 34 61 30 57 18 45 46 57 8v85H0z"/><rect width="640" height="420" fill="url(#grid)"/><g id="weather"></g><g aria-hidden="true"><circle cx="320" cy="239.7" r="5" fill="#f3fbff"/><text x="330" y="245" fill="#fff" font-size="19" paint-order="stroke" stroke="#102632" stroke-width="4">ปัตตานี</text><text x="16" y="24" fill="#c7dfeb" font-size="15">แผนที่โครงร่างจำลอง</text></g></svg><div class="group"><span id="key" class="key rain">สี = ความเข้มฝนจำลอง</span></div><p id="info" class="note"></p><div class="control"><button id="play" aria-pressed="false">เล่น</button><input id="frame" aria-label="เลือกเฟรมเวลา" type="range" min="0" max="5" value="0"><output id="time" for="frame"></output></div><p class="note">หน่วยเวลา: Asia/Bangkok (UTC+7) · ไม่มีการเรียก API หรือตำแหน่งอุปกรณ์</p><a href="https://instrument.tmd.go.th/radar/" rel="noopener noreferrer">เปิดเรดาร์ทางการของกรมอุตุนิยมวิทยา</a></main><script>
const q=id=>document.getElementById(id), p=q('play'), slider=q('frame'), t=q('time'), w=q('weather');
let mode='radar', n=0, interval=null;
const tz=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const point=([lon,lat])=>[(lon-100.55)*640/1.4,(7.35-lat)*420/.84];
const track=[[101.76,6.68],[101.58,6.75],[101.39,6.83],[101.15,6.93],[100.92,7.02],[100.72,7.15]];
const stamp=(n)=>Date.UTC(2026,6,14,2,mode==='radar'?n*10:0)+(mode==='storm'?n*3*3600000:0);
const line=pts=>pts.map(pair=>point(pair).map(x=>x.toFixed(1)).join(',')).join(' ');
function draw(){
 slider.value=n; slider.setAttribute('aria-valuetext', tz.format(stamp(n))+' น.');
 const future=mode==='storm'&&n>=3;
 t.textContent=tz.format(stamp(n))+' น.'+(mode==='storm'?(future?' · เวลาคาดการณ์':' · เวลาวิเคราะห์'):' · เวลาเฟรม');
 if(mode==='radar'){
  const [x,y]=point([101.57-n*.065,6.81+n*.035]),[x2,y2]=point([100.90+n*.055,6.96-n*.018]);
  w.innerHTML=`<ellipse cx="${x}" cy="${y}" rx="110" ry="72" fill="url(#precip)"/><ellipse cx="${x2}" cy="${y2}" rx="82" ry="62" fill="url(#precip)"/>`;
 } else {
  const [x,y]=point(track[n]);
  w.innerHTML=`<polyline points="${line(track.slice(0,3))}" fill="none" stroke="#57e2d8" stroke-width="4"/><polyline points="${line(track.slice(2))}" fill="none" stroke="#fbd07f" stroke-dasharray="10 7" stroke-width="4"/><circle cx="${x}" cy="${y}" r="${future?30:17}" fill="${future?'#fbd07f':'#57e2d8'}" fill-opacity=".24" stroke="${future?'#fbd07f':'#57e2d8'}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="6" fill="#fff"/>`;
 }
}
function stop(){if(interval!==null) clearInterval(interval);interval=null;p.textContent='เล่น';p.setAttribute('aria-pressed','false')}
function choose(next){stop();mode=next;n=0;for(const a of ['radar','storm'])q(a).setAttribute('aria-pressed',String(a===mode));const k=q('key');k.textContent=mode==='radar'?'สี = ความเข้มฝนจำลอง':'เส้นทึบ = วิเคราะห์ · เส้นประ = คาดการณ์';k.className=mode==='radar'?'key rain':'key future';q('info').textContent=mode==='radar'?'เฟรมสังเคราะห์ 6 ภาพ ห่างกัน 10 นาที ไม่ใช่การพยากรณ์':'ออกพยากรณ์ 15:00 น. (จำลอง) จุดคาดการณ์ไม่ใช่พื้นที่เตือนภัย';draw()}
p.addEventListener('click',()=>{if(interval!==null){stop();return}p.textContent='หยุด';p.setAttribute('aria-pressed','true');interval=setInterval(()=>{n=(n+1)%6;draw()},780)});
slider.addEventListener('input',()=>{stop();n=Number(slider.value);draw()});
for(const a of ['radar','storm'])q(a).addEventListener('click',()=>choose(a));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});choose('radar');
</script></body></html>
